name: Vyramo Web CI

on:
  push:
    branches:
      - vyramo-video-engine-v1
    paths:
      - "apps/vyramo-web/**"
      - ".github/workflows/vyramo-web.yml"
  pull_request:
    paths:
      - "apps/vyramo-web/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vyramo-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
