services:
  maestra-v2:
    build: .
    restart: unless-stopped
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - maestra_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  maestra_data:
